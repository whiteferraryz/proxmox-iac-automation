stages: [validate, plan, apply, configure]

default:
  tags: [lab]

variables:
  # Sửa lại TF_ROOT trỏ đúng vào thư mục infra/terraform
  TF_ROOT: infra/terraform
  TF_ADDRESS: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/lab
  TF_VAR_ssh_public_key_path: /home/gitlab-runner/.ssh/lab_ed25519.pub
  PROXMOX_VE_ENDPOINT: "https://192.168.42.11:8006/"
  PROXMOX_VE_INSECURE: "true"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.terraform:
  before_script:
    - export PROXMOX_VE_API_TOKEN="terraform@pve!tf=${PM_TOKEN_SECRET}"
    # Xoá lệnh cd thủ công ở đây vì terraform init sẽ dùng -chdir hoặc chạy đúng thư mục TF_ROOT
    - terraform -chdir=${TF_ROOT} init -input=false
        -backend-config="address=${TF_ADDRESS}"
        -backend-config="lock_address=${TF_ADDRESS}/lock"
        -backend-config="unlock_address=${TF_ADDRESS}/lock"
        -backend-config="lock_method=POST"
        -backend-config="unlock_method=DELETE"
        -backend-config="retry_wait_min=5"
        -backend-config="username=gitlab-ci-token"
        -backend-config="password=${CI_JOB_TOKEN}"

validate:
  stage: validate
  script:
    - terraform -chdir=${TF_ROOT} fmt -check -recursive
    - terraform -chdir=${TF_ROOT} init -backend=false -input=false
    - terraform -chdir=${TF_ROOT} validate
    - cd infra/ansible && yamllint . && ansible-lint site.yml

plan:
  stage: plan
  extends: .terraform
  script:
    - terraform -chdir=${TF_ROOT} plan -input=false -out=tfplan
    - terraform -chdir=${TF_ROOT} show -no-color tfplan > ${TF_ROOT}/plan.txt
  artifacts:
    paths: [infra/terraform/tfplan, infra/terraform/plan.txt]
    expire_in: 1 day

apply:
  stage: apply
  extends: .terraform
  needs: [plan]
  script:
    - terraform -chdir=${TF_ROOT} apply -input=false tfplan
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: lab

configure:
  stage: configure
  extends: .terraform
  needs: [apply]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cd infra/ansible
    - ./scripts/gen-inventory.sh
    - ansible-playbook site.yml