stages: [validate, plan, apply, configure]

default:
  tags: [lab]

variables:
  TF_ROOT: infra/terraform
  TF_ADDRESS: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/lab
  TF_VAR_ssh_public_key_path: /home/gitlab-runner/.ssh/lab__ed25519.pub
  PROXMOX_VE_ENDPOINT: "https://192.168.42.11:8006/"
  PROXMOX_VE_INSECURE: "true"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.terraform:
  before_script:
    - export PROXMOX_VE_API_TOKEN="terraform@pve!tf2=${PM_TOKEN_SECRET}"
    - export TF_HTTP_USERNAME="gitlab-ci-token"
    - export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
    - terraform -chdir=${TF_ROOT} init -input=false
        -backend-config="address=${TF_ADDRESS}"
        -backend-config="lock_address=${TF_ADDRESS}/lock"
        -backend-config="unlock_address=${TF_ADDRESS}/lock"
        -backend-config="lock_method=POST"
        -backend-config="unlock_method=DELETE"
        -backend-config="retry_wait_min=5"
        -backend-config="username=gitlab-ci-token"
        -backend-config="password=${CI_JOB_TOKEN}"

validate:
  stage: validate
  extends: .terraform
  script:
    - terraform -chdir=${TF_ROOT} fmt -recursive
    - terraform -chdir=${TF_ROOT} validate

before_script:
- |
    # Sử dụng đúng biến token đã được export chuẩn ở trên
    export PROXMOX_VE_API_TOKEN="terraform@pve!tf2=${PM_TOKEN_SECRET}"
    
    # Gọi curl trực tiếp từ thư mục gốc của project (không cần cd infra/terraform nữa)
    HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" -H "Authorization: PVEAPIToken=$PROXMOX_VE_API_TOKEN" https://192.168.42.11:8006/api2/json/nodes/pve1/qemu/110/status/current)
    
    if [ "$HTTP_CODE" -eq 200 ]; then
      echo "VM 110 đã tồn tại trên Proxmox, tiến hành import vào state..."
      terraform -chdir=${TF_ROOT} import 'module.vm["web01"].proxmox_virtual_environment_vm.this' 110 || true
    fi
plan:
  stage: plan
  extends: .terraform
  script:
    - terraform -chdir=${TF_ROOT} plan -input=false -out=tfplan
    - terraform -chdir=${TF_ROOT} show -no-color tfplan > ${TF_ROOT}/plan.txt
  artifacts:
    paths: [infra/terraform/tfplan, infra/terraform/plan.txt]
    expire_in: 1 day

apply:
  stage: apply
  extends: .terraform
  needs: [plan]
  script:
    - export TF_HTTP_USERNAME="gitlab-ci-token"
    - export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
    - terraform -chdir=${TF_ROOT} apply -input=false -auto-approve
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: lab

configure:
  stage: configure
  extends: .terraform
  needs: [apply]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    ANSIBLE_HOST_KEY_CHECKING: "False"
    ANSIBLE_PRIVATE_KEY_FILE: "/home/gitlab-runner/.ssh/lab__ed25519"
  script:
    - cd infra/ansible
    - ./scripts/gen-inventory.sh
    - ansible-playbook site.yml